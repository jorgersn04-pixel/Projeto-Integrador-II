<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pronto Socorro</title>
    <link rel="stylesheet" href="/css/styles.css" />
  </head>
  <body>
    <div id="login-container" class="auth-screen">
      <div class="login-card">
        <div class="login-header">
          <h1>Pronto Socorro</h1>
          <p>Controle de atendimento</p>
        </div>

        <form id="login-form">
          <label for="email">E-mail</label>
          <input id="email" name="email" type="email" placeholder="nome@hospital.com" required />

          <label for="senha">Senha</label>
          <input id="senha" name="senha" type="password" placeholder="Digite sua senha" required />

          <button type="submit">Entrar</button>
        </form>

        <div id="login-status" class="status-message" aria-live="polite"></div>
      </div>
    </div>

    <div id="dashboard-container" class="dashboard-container hidden">
      <aside class="sidebar">
        <div class="sidebar-brand">
          <h2>Pronto Socorro</h2>
        </div>

        <nav class="sidebar-nav" aria-label="Menu principal">
          <button class="nav-btn active" data-section="secao-recepcao" type="button">Recepção</button>
          <button class="nav-btn" data-section="secao-triagem" type="button">Triagem</button>
          <button class="nav-btn" data-section="secao-medico" type="button">Médico</button>
          <button class="nav-btn" data-section="secao-painel" type="button">Painel</button>
        </nav>
      </aside>

      <main class="main-content">
        <section id="secao-recepcao" class="content-section card">
          <div class="section-header">
            <h3>Recepção</h3>
          </div>

          <form id="paciente-form" class="form-card">
            <div class="grid-2">
              <label>
                Nome completo
                <input type="text" name="nome_completo" required />
              </label>
              <label>
                CPF
                <input type="text" name="cpf" placeholder="000.000.000-00" required />
              </label>
              <label>
                RG
                <input type="text" name="rg" required />
              </label>
              <label>
                Nome da mãe
                <input type="text" name="nome_mae" required />
              </label>
              <label>
                Nome do pai
                <input type="text" name="nome_pai" />
              </label>
              <label>
                Data de nascimento
                <input type="date" name="data_nascimento" required />
              </label>
              <label>
                Sexo
                <select name="sexo" required>
                  <option value="">Selecione</option>
                  <option value="M">Masculino</option>
                  <option value="F">Feminino</option>
                </select>
              </label>
              <label>
                Telefone
                <input type="text" name="telefone" />
              </label>
              <label>
                Endereço
                <input type="text" name="endereco" />
              </label>
              <label>
                E-mail
                <input type="email" name="email" />
              </label>
            </div>
            <button type="submit">Salvar paciente</button>
          </form>

          <div id="paciente-lista" class="list-box"></div>
        </section>

        <section id="secao-triagem" class="content-section card hidden">
          <div class="section-header">
            <h3>Triagem</h3>
          </div>

          <form id="triagem-form" class="form-card">
            <div class="grid-2">
              <label>
                ID do atendimento
                <input type="number" name="id_atendimento" required />
              </label>
              <label>
                Pressão arterial
                <input type="text" name="pressao_arterial" placeholder="120x80" />
              </label>
              <label>
                Temperatura
                <input type="text" name="temperatura" placeholder="36.5" />
              </label>
              <label>
                FC (bpm)
                <input type="number" name="frequencia_cardiaca" />
              </label>
              <label class="full-width">
                Queixa principal
                <textarea name="queixa_principal" required></textarea>
              </label>
              <label>
                Classificação Manchester
                <select name="classificacao_manchester" required>
                  <option value="">Selecione</option>
                  <option value="VERMELHO">VERMELHO</option>
                  <option value="LARANJA">LARANJA</option>
                  <option value="AMARELO">AMARELO</option>
                  <option value="VERDE">VERDE</option>
                  <option value="AZUL">AZUL</option>
                </select>
              </label>
            </div>
            <button type="submit">Registrar triagem</button>
          </form>

          <div id="triagem-status" class="status-message" aria-live="polite"></div>
        </section>

        <section id="secao-medico" class="content-section card hidden">
          <div class="section-header">
            <h3>Médico</h3>
          </div>

          <div class="form-card">
            <h4>Iniciar consulta</h4>
            <div class="grid-2">
              <label>
                ID do atendimento
                <input type="number" id="iniciar-atendimento-id" />
              </label>
            </div>
            <button id="iniciar-consulta-btn" type="button">Iniciar consulta</button>
          </div>

          <div class="form-card">
            <h4>Finalizar consulta</h4>
            <div class="grid-2">
              <label>
                ID do atendimento
                <input type="number" id="finalizar-atendimento-id" />
              </label>
              <label>
                Diagnóstico
                <input type="text" id="diagnostico" />
              </label>
              <label>
                Medicações
                <input type="text" id="medicacoes_prescritas" />
              </label>
              <label>
                Observações
                <input type="text" id="observacoes" />
              </label>
            </div>
            <button id="finalizar-consulta-btn" type="button">Finalizar consulta</button>
          </div>
        </section>

        <section id="secao-painel" class="content-section card hidden">
          <div class="section-header">
            <h3>Painel</h3>
          </div>

          <div class="panel-list">
            <h4>Atendimentos aguardando médico</h4>
            <div id="painel-medico"></div>
          </div>
        </section>
      </main>
    </div>

    <script type="module" src="/js/app.js"></script>
  </body>
</html>
